<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - WHMS</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex;
               align-items: center; justify-content: center; background: #f4f6f9; color: #222; text-align: center; padding: 16px; }
        .box { max-width: 420px; }
        h1 { font-size: 1.4rem; margin-bottom: .5rem; }
        p { color: #555; }
        button { background: #1b84ff; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>You are offline</h1>
        <p>WHMS needs a connection to load live stock data. Check your network, then try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
